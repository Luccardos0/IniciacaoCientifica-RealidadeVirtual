<!DOCTYPE html>
<html>
<head>
    <title>Cena 2 - Switch Moderno</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/ui-style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/aframe-components.js"></script>
    <script src="js/muon-simulation.js"></script>
</head>
<body>
    <div class="ui-layer">
        <div class="card info-box cena2">
            <h2 class="cena2">Trajetória do Múon</h2>
            <p>
                Os múons são partículas instáveis.<br>
                1. Raio Solar (laranja)<br>
                2. 1ª Geração (roxo)<br>
                3. 2ª Geração (rosa suave)<br><br>
                Use o botão switch à direita para ligar ou desligar a visualização da trajetória tracejada.
            </p>
        </div>
        
        <div class="card nav-box">
            <div>
                <button class="btn btn-1" onclick="location.href='index.html'">Cena 1</button>
                <button class="btn btn-2 cena2" onclick="location.href='cena2.html'">Cena 2</button>
                <button class="btn btn-1" onclick="location.href='cena3.html'">Cena 3</button>
                <button class="btn btn-1" onclick="location.href='cena4.html'">Cena 4</button>
                <button class="btn btn-1" onclick="location.href='cena5.html'">Cena 5</button>
            </div>
            
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="chkTrace" checked>
                    <span class="slider"></span>
                </label>
                <span class="toggle-label-text" onclick="document.getElementById('chkTrace').click()">Mostrar Trajetória</span>
            </div>
        </div>
    </div>

    <a-scene id="sceneCena2" shadow="type: pcfsoft">
        <a-assets>
            <img id="imSun" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Map_of_the_full_sun.jpg/1280px-Map_of_the_full_sun.jpg">
            <img id="imEarth" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Blue_Marble_2002.png/1280px-Blue_Marble_2002.png">
            <img id="imSky" src="https://jocoteles.github.io/Minicurso-A-Frame-VR/TychoSkymap.t4_04096x02048.jpg">
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera look-controls wasd-controls position="0 1.6 0">
                <a-cursor raycaster="objects: .raycastable" material="color: #FF00FF; shader: flat" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"></a-cursor>
            </a-camera>
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
        </a-entity>

        <a-entity position="0 0.6 -1.4" rotation="-35 0 0" scale="1.3 1.3 1.3">
            
            <a-box position="0 0 0" width="1.8" height="1.0" depth="0.12" material="color: #1e1e24; roughness: 0.9"></a-box>
            <a-plane position="0 0 0.061" width="1.76" height="0.96" material="color: #0f0f14; shader: flat"></a-plane>
            <a-plane position="0 0 0.062" width="1.74" height="0.94" material="color: #3f444a; wireframe: true; opacity: 0.4"></a-plane>

            <a-entity position="0 0 0.063" painel-explicativo="cenaAtual: 2">
                
                <a-plane position="0 0.08 0.001" width="1.15" height="0.65" material="color: #07070a; shader: flat"></a-plane>
                <a-plane position="0 0.08 0.000" width="1.16" height="0.66" material="color: #58a6ff; opacity: 0.25; shader: flat"></a-plane>

                <a-entity class="texto-conteudo" position="-0.5 0.35 0.005"
          text="value: Carregando...; color: #e6edf3; width: 1.05; font: roboto; wrapCount: 42; anchor: left; baseline: top; align: justify"></a-entity>

                <a-triangle class="btn-cena-anterior raycastable" position="-0.2 -0.4 0.02" rotation="0 0 90" 
            vertex-a="0 0.08 0" vertex-b="-0.07 -0.04 0" vertex-c="0.07 -0.04 0" 
            material="color: #FFB6C1; shader: flat; side: double"
            animation__mouseenter="property: material.color; to: #ff6b8b; dur: 100; startEvents: mouseenter"
            animation__mouseleave="property: material.color; to: #FFB6C1; dur: 100; startEvents: mouseleave">
                </a-triangle>

                <a-triangle class="btn-cena-proxima raycastable" position="0.2 -0.4 0.02" rotation="0 0 -90" 
            vertex-a="0 0.08 0" vertex-b="-0.07 -0.04 0" vertex-c="0.07 -0.04 0" 
            material="color: #FFB6C1; shader: flat; side: double"
            animation__mouseenter="property: material.color; to: #ff6b8b; dur: 100; startEvents: mouseenter"
            animation__mouseleave="property: material.color; to: #FFB6C1; dur: 100; startEvents: mouseleave">
                </a-triangle>

                <a-triangle class="btn-voltar-texto raycastable" position="-0.75 0.08 0.02" rotation="0 0 90" 
            vertex-a="0 0.06 0" vertex-b="-0.05 -0.03 0" vertex-c="0.05 -0.03 0" 
            material="color: #58a6ff; shader: flat; side: double"
            animation__mouseenter="property: material.color; to: #1f6feb; dur: 100; startEvents: mouseenter"
            animation__mouseleave="property: material.color; to: #58a6ff; dur: 100; startEvents: mouseleave">
                </a-triangle>

                <a-triangle class="btn-avancar-texto raycastable" position="0.75 0.08 0.02" rotation="0 0 -90" 
            vertex-a="0 0.06 0" vertex-b="-0.05 -0.03 0" vertex-c="0.05 -0.03 0" 
            material="color: #58a6ff; shader: flat; side: double"
            animation__mouseenter="property: material.color; to: #1f6feb; dur: 100; startEvents: mouseenter"
            animation__mouseleave="property: material.color; to: #58a6ff; dur: 100; startEvents: mouseleave">
                </a-triangle>

            </a-entity>
        </a-entity>

        <a-sky src="#imSky" rotation="0 -90 0"></a-sky>
        <a-entity light="type: ambient; color: #444"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.5; castShadow: true" position="0 20 -8"></a-entity>
        <a-sphere position="0 25 -8" src="#imSun" radius="5" light="type: point; intensity: 2; distance: 50" material="shader: flat"></a-sphere>

        <a-entity position="0 -4 -8" rotation="0 0 23.4">
            <a-sphere src="#imEarth" radius="6" shadow="receive: true"></a-sphere>
            <a-sphere radius="9" material="color: #87CEEB; opacity: 0.15; transparent: true; side: back; blending: additive"></a-sphere>
        </a-entity>
    </a-scene>
</body>
</html>
