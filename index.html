<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Cena 1 - Ordem Aleatória</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/ui-style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/aframe-components.js"></script>
    <script src="js/muon-simulation.js"></script>
</head>
<body>

    <div class="ui-layer">
        <div class="card info-box cena1">
            <h2 class="cena1">Relatividade Restrita</h2>
            <p>Os raios cósmicos viajam do Sol até a Terra. Ao colidirem com a alta atmosfera, transformam-se em <b>Múons</b>, que caem em alta velocidade.</p>
            <hr style="border-color: rgba(255,255,255,0.2); margin: 15px 0;">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: white;">Legenda</h3>
            <div class="legenda-item">
                <div class="dot" style="background: #FF4500; box-shadow: 0 0 5px #FF4500;"></div>
                <span>Raio Cósmico</span>
            </div>
            <div class="legenda-item">
                <div class="dot" style="background: #9370DB; box-shadow: 0 0 5px #9370DB;"></div>
                <span>Múon</span>
            </div>
        </div>

        <div class="card nav-box">
            <button class="btn btn-2 cena1" onclick="location.href='index.html'">Cena 1</button>
            <button class="btn btn-1" onclick="location.href='cena2.html'">Cena 2</button>
            <button class="btn btn-1" onclick="location.href='cena3.html'">Cena 3</button>
            <button class="btn btn-1" onclick="location.href='cena4.html'">Cena 4</button>
            <button class="btn btn-1" onclick="location.href='cena5.html'">Cena 5</button>
        </div>
    </div>

    <a-scene shadow="type: pcfsoft" id="sceneCena1">
        <a-assets>
            <img id="mapa_sol" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Map_of_the_full_sun.jpg/1280px-Map_of_the_full_sun.jpg">
            <img id="mapa_terra" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Blue_Marble_2002.png/1280px-Blue_Marble_2002.png">
            <img id="skymap" src="https://jocoteles.github.io/Minicurso-A-Frame-VR/TychoSkymap.t4_04096x02048.jpg">
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera look-controls wasd-controls position="0 1.6 0">
                <a-cursor raycaster="objects: .raycastable" material="color: #FF00FF; shader: flat" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"></a-cursor>
            </a-camera>
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
        </a-entity>

        <!-- ESTAÇÃO DUPLA DE COMANDO 3D (POSICIONADA A 90° À ESQUERDA) -->
        <a-entity position="-4.5 1.2 0" rotation="0 90 0" painel-explicativo="cenaAtual: 1">
            
            <!-- 1. PAINEL SUPERIOR: TELA DE LEITURA 3D -->
            <a-entity position="0 0.95 0">
                <a-box position="0 0 0" width="3.6" height="2.1" depth="0.1" material="color: #12131C; roughness: 0.5"></a-box>
                <a-plane position="0 0 0.055" width="3.5" height="2.0" material="color: #58a6ff; shader: flat"></a-plane>
                <a-plane position="0 0 0.058" width="3.44" height="1.94" material="color: #08090E; shader: flat"></a-plane>

                <a-entity class="texto-conteudo" position="-1.58 0.8 0.063"
                          text="value: Carregando...; color: #FFFFFF; width: 3.1; font: roboto; wrapCount: 34; anchor: left; baseline: top; align: justify"></a-entity>
            </a-entity>

            <!-- 2. PAINEL INFERIOR: CONSOLE DE NAVEGAÇÃO -->
            <a-entity position="0 -0.75 0">
                <a-box position="0 0 0" width="3.6" height="1.0" depth="0.12" material="color: #1A1C29; roughness: 0.8"></a-box>
                <a-plane position="0 0 0.065" width="3.5" height="0.92" material="color: #0E1017; shader: flat"></a-plane>

                <!-- NAVEGAÇÃO DE PÁGINAS (BOTÕES AZUIS) -->
                <a-entity position="-0.9 0 0.07">
                    <a-entity position="0 0.22 0.005" text="value: PÁGINAS; color: #58a6ff; align: center; width: 1.8; font: roboto"></a-entity>
                    <a-box class="btn-voltar-texto raycastable" position="-0.28 -0.05 0.02" width="0.4" height="0.28" depth="0.05" material="color: #1F3A5F">
                        <a-triangle position="0 0 0.03" rotation="0 0 90" vertex-a="0 0.07 0" vertex-b="-0.06 -0.04 0" vertex-c="0.06 -0.04 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
                    </a-box>
                    <a-box class="btn-avancar-texto raycastable" position="0.28 -0.05 0.02" width="0.4" height="0.28" depth="0.05" material="color: #1F3A5F">
                        <a-triangle position="0 0 0.03" rotation="0 0 -90" vertex-a="0 0.07 0" vertex-b="-0.06 -0.04 0" vertex-c="0.06 -0.04 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
                    </a-box>
                </a-entity>

                <!-- NAVEGAÇÃO DE CENAS (BOTÕES ROSAS) -->
                <a-entity position="0.9 0 0.07">
                    <a-entity position="0 0.22 0.005" text="value: TROCAR CENA; color: #FFB6C1; align: center; width: 1.8; font: roboto"></a-entity>
                    <a-box class="btn-cena-anterior raycastable" position="-0.28 -0.05 0.02" width="0.4" height="0.28" depth="0.05" material="color: #5F1F3A">
                        <a-triangle position="0 0 0.03" rotation="0 0 90" vertex-a="0 0.07 0" vertex-b="-0.06 -0.04 0" vertex-c="0.06 -0.04 0" material="color: #FFB6C1; shader: flat; side: double"></a-triangle>
                    </a-box>
                    <a-box class="btn-cena-proxima raycastable" position="0.28 -0.05 0.02" width="0.4" height="0.28" depth="0.05" material="color: #5F1F3A">
                        <a-triangle position="0 0 0.03" rotation="0 0 -90" vertex-a="0 0.07 0" vertex-b="-0.06 -0.04 0" vertex-c="0.06 -0.04 0" material="color: #FFB6C1; shader: flat; side: double"></a-triangle>
                    </a-box>
                </a-entity>
            </a-entity>

        </a-entity>

        <a-sky src="#skymap" rotation="0 -90 0"></a-sky>
        <a-entity light="type: ambient; color: #BBB; intensity: 0.3"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.5; castShadow: true" position="15 5 -10" target="#terra"></a-entity>

        <a-entity position="20 5 -25">
            <a-entity id="sol" geometry="primitive: sphere; radius: 5" material="src: #mapa_sol; shader: flat"
                animation="property: rotation; to: 0 -360 0; loop: true; dur: 120000; easing: linear"
                light="type: point; color: #FFF; intensity: 2; distance: 100">
            </a-entity>
        </a-entity>

        <a-entity position="-20 0 -25" rotation="0 0 23.4">
            <a-entity id="terra" geometry="primitive: sphere; radius: 6" material="src: #mapa_terra; roughness: 0.8"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 60000; easing: linear" shadow="receive: true; cast: true">
            </a-entity>
            <a-entity id="atmosfera" geometry="primitive: sphere; radius: 9.0" material="color: #87CEEB; opacity: 0.15; transparent: true; side: front; blending: additive"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
