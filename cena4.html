<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Cena 4 - O Referencial do Múon</title>
    <link rel="stylesheet" href="css/ui-style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/aframe-components.js"></script>
    <script src="js/muon-simulation.js"></script>
</head>
<body>
    <div class="ui-layer">
        <div class="card info-box" style="border-color: #87CEEB;">
            <h2 style="color: #87CEEB;">Referencial do Múon</h2>
            <p id="status-painel">
                Carregando dados do referencial físico...
            </p>
        </div>
        
        <div class="card nav-box" style="border-color: #87CEEB;">
            <div>
                <button class="btn btn-1" onclick="location.href='index.html'">Cena 1</button>
                <button class="btn btn-1" onclick="location.href='cena2.html'">Cena 2</button>
                <button class="btn btn-1" onclick="location.href='cena3.html'">Cena 3</button>
                <button class="btn btn-2" style="background: #87CEEB; color: black;" onclick="location.href='cena4.html'">Cena 4</button>
                <button class="btn btn-1" onclick="location.href='cena5.html'">Cena 5</button>
            </div>
            
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="switch-relatividade">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label-text" onclick="document.getElementById('switch-relatividade').click()">Efeito Relativístico</span>
            </div>
        </div>
    </div>

    <a-scene id="sceneCena4">
        <a-assets>
            <img id="textura-solo" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/textures/terrain/grasslight-big.jpg">
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera look-controls wasd-controls="enabled: false" position="0 1.6 0">
                <a-cursor raycaster="objects: .raycastable" 
                          material="color: #FF00FF; shader: flat" 
                          position="0 0 -1" 
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015">
                </a-cursor>

                <a-text id="hud-sucesso" value="" align="center" position="0 0 -2" scale="0 0 0"
                        color="#87CEEB" font="mozillavr"
                        animation__fade="property: scale; to: 1 1 1; dur: 300; startEvents: mostrarMsg"
                        animation__hide="property: scale; to: 0 0 0; dur: 300; delay: 2500; startEvents: esconderMsg">
                </a-text>
            </a-camera>
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
        </a-entity>

        <!-- Container de efeitos de decaimento do múon -->
        <a-entity id="container-decaimento" position="0 1.6 -1.5"></a-entity>

        <!-- ======================================================= -->
        <!-- CONTROLES FLUTUANTES FRONTAIS                           -->
        <!-- ======================================================= -->
        <a-entity position="0 0.7 -1.8" rotation="-20 0 0" painel-explicativo="cenaAtual: 4">
            <!-- BOTÃO INFO -->
            <a-entity class="btn-toggle-info raycastable" position="-0.38 0 0">
                <a-box class="raycastable" width="0.52" height="0.26" depth="0.04" material="color: #2A6F97; roughness: 0.5"></a-box>
                <a-entity position="0 0 0.025" text="value: INFO; color: #FFFFFF; align: center; width: 1.8; font: roboto"></a-entity>
            </a-entity>

            <!-- NAVEGAÇÃO ENTRE CENAS -->
            <a-entity position="0.35 0 0">
                <a-entity position="0 0.13 0" text="value: TROCAR CENA; color: #FFD1DC; align: center; width: 1.2; font: roboto"></a-entity>
                <a-box class="btn-cena-anterior raycastable" position="-0.15 -0.04 0" width="0.24" height="0.18" depth="0.04" material="color: #A83264; roughness: 0.4">
                    <a-triangle position="0 0 0.025" rotation="0 0 90" vertex-a="0 0.04 0" vertex-b="-0.03 -0.02 0" vertex-c="0.03 -0.02 0" material="color: #FFFFFF; shader: flat; side: double"></a-triangle>
                </a-box>
                <a-box class="btn-cena-proxima raycastable" position="0.15 -0.04 0" width="0.24" height="0.18" depth="0.04" material="color: #A83264; roughness: 0.4">
                    <a-triangle position="0 0 0.025" rotation="0 0 -90" vertex-a="0 0.04 0" vertex-b="-0.03 -0.02 0" vertex-c="0.03 -0.02 0" material="color: #FFFFFF; shader: flat; side: double"></a-triangle>
                </a-box>
            </a-entity>

            <!-- BOTÃO INFERIOR RETANGULAR (RELATIVIDADE) -->
            <a-entity class="btn-toggle-trr-3d raycastable" position="-0.01 -0.30 0">
                <a-box class="raycastable" width="1.26" height="0.22" depth="0.04" material="color: #6A3A8A; roughness: 0.5"></a-box>
                <a-entity class="texto-btn-trr" position="0 0 0.025" text="value: RELATIVIDADE: DESLIGADA; color: #FFFFFF; align: center; width: 1.8; font: roboto"></a-entity>
            </a-entity>
        </a-entity>

        <!-- ======================================================= -->
        <!-- PAINEL POP-UP DE LEITURA                                -->
        <!-- ======================================================= -->
        <a-entity id="modal-leitura-info" position="0 1.6 -1.8" visible="false" scale="0.001 0.001 0.001">
            <a-box position="0 0 0" width="2.6" height="1.6" depth="0.08" material="color: #12131C; roughness: 0.5"></a-box>
            <a-plane position="0 0 0.045" width="2.52" height="1.52" material="color: #58a6ff; shader: flat"></a-plane>
            <a-plane position="0 0 0.048" width="2.46" height="1.46" material="color: #08090E; shader: flat"></a-plane>

            <a-entity class="texto-conteudo" position="-1.15 0.55 0.055"
                      text="value: Carregando...; color: #FFFFFF; width: 2.3; font: roboto; wrapCount: 32; anchor: left; baseline: top; align: justify"></a-entity>

            <a-entity position="0 -0.55 0.055">
                <a-box class="btn-voltar-texto raycastable" position="-0.48 0 0" width="0.28" height="0.18" depth="0.04" material="color: #1F3A5F; roughness: 0.4">
                    <a-triangle position="0 0 0.025" rotation="0 0 90" vertex-a="0 0.04 0" vertex-b="-0.035 -0.02 0" vertex-c="0.035 -0.02 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
                </a-box>

                <a-box class="btn-avancar-texto raycastable" position="-0.16 0 0" width="0.28" height="0.18" depth="0.04" material="color: #1F3A5F; roughness: 0.4">
                    <a-triangle position="0 0 0.025" rotation="0 0 -90" vertex-a="0 0.04 0" vertex-b="-0.035 -0.02 0" vertex-c="0.035 -0.02 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
                </a-box>

                <a-box class="btn-fechar-modal raycastable" position="0.32 0 0" width="0.48" height="0.18" depth="0.04" material="color: #B22222; roughness: 0.4">
                    <a-entity position="0 0 0.025" text="value: FECHAR; color: #FFFFFF; align: center; width: 1.6; font: roboto"></a-entity>
                </a-box>
            </a-entity>
        </a-entity>

        <!-- Céu em Degradê vertical -->
        <a-sky material="shader: sky-gradient; topColor: #050B1A; bottomColor: #4A9FFF; exponent: 0.7;"></a-sky>

        <a-entity light="type: ambient; color: #777"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="-1 10 5"></a-entity>

        <a-entity id="container-nuvens"></a-entity>
        <a-entity id="container-solo"></a-entity>
    </a-scene>
</body>
</html>
