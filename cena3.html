<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Cena 3 - Fluxo de Múons</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/ui-style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="js/aframe-components.js"></script>
    <script src="js/muon-simulation.js"></script>
</head>
<body>
    <div class="ui-layer">
        <!-- CARD DE CONTROLE 2D ATUALIZADO (SELEÇÃO RÁPIDA DE FLUXO) -->
        <div class="card control-box">
            <h2>Configurações</h2>
            <p style="color: #ccc; font-size: 13px; margin-bottom: 10px;">Selecione a quantidade de múons por ciclo:</p>
            <div class="control-group" style="display: flex; gap: 10px;">
                <button class="btn btn-1" id="btn-2d-muons-3" onclick="if(typeof setQtdMuonsCena3 === 'function') setQtdMuonsCena3(3);" style="flex: 1; background: #00FF7F; color: #111; font-weight: bold;">3 Múons</button>
                <button class="btn btn-1" id="btn-2d-muons-6" onclick="if(typeof setQtdMuonsCena3 === 'function') setQtdMuonsCena3(6);" style="flex: 1; background: #1F3A5F; color: #FFF;">6 Múons</button>
            </div>
        </div>
        
        <div class="card nav-box">
            <button class="btn btn-1" onclick="location.href='index.html'">Cena 1</button>
            <button class="btn btn-1" onclick="location.href='cena2.html'">Cena 2</button>
            <button class="btn btn-2 cena3" onclick="location.href='cena3.html'">Cena 3</button>
            <button class="btn btn-1" onclick="location.href='cena4.html'">Cena 4</button>
            <button class="btn btn-1" onclick="location.href='cena5.html'">Cena 5</button>  
        </div>
    </div>

    <a-scene id="sceneCena3">
        <a-assets>
            <img id="imSky" src="https://jocoteles.github.io/Minicurso-A-Frame-VR/TychoSkymap.t4_04096x02048.jpg">
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera look-controls wasd-controls position="0 1.6 0">
                <a-cursor raycaster="objects: .raycastable" material="color: #FF00FF; shader: flat" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"></a-cursor>
            </a-camera>
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
        </a-entity>

        <!-- ESTAÇÃO DUPLA DE COMANDO 3D (CENA 3 - POSICIONADA A 90° À ESQUERDA) -->
<a-entity position="-4.5 1.2 0" rotation="0 90 0" painel-explicativo="cenaAtual: 3">
    
    <!-- 1. PAINEL SUPERIOR: TELA DE LEITURA 3D -->
    <a-entity position="0 0.95 0">
        <a-box position="0 0 0" width="3.6" height="2.1" depth="0.1" material="color: #12131C; roughness: 0.5"></a-box>
        <a-plane position="0 0 0.055" width="3.5" height="2.0" material="color: #58a6ff; shader: flat"></a-plane>
        <a-plane position="0 0 0.058" width="3.44" height="1.94" material="color: #08090E; shader: flat"></a-plane>

        <a-entity class="texto-conteudo" position="-1.58 0.8 0.063"
                  text="value: Carregando...; color: #FFFFFF; width: 3.1; font: roboto; wrapCount: 34; anchor: left; baseline: top; align: justify"></a-entity>
    </a-entity>

    <!-- 2. PAINEL INFERIOR: CONSOLE DE COMANDOS DEDICADO -->
    <a-entity position="0 -0.75 0">
        <a-box position="0 0 0" width="3.6" height="1.0" depth="0.12" material="color: #1A1C29; roughness: 0.8"></a-box>
        <a-plane position="0 0 0.065" width="3.5" height="0.92" material="color: #0E1017; shader: flat"></a-plane>

        <!-- LINHA SUPERIOR: NAVEGAÇÃO DE PÁGINAS E CENAS (POSICIONADAS MAIS AO TOPO) -->
        
        <!-- ESQUERDA: PÁGINAS (BOTÕES AZUIS) -->
        <a-entity position="-0.9 0.25 0.07">
            <a-entity position="0 0.15 0.005" text="value: PÁGINAS; color: #58a6ff; align: center; width: 1.6; font: roboto"></a-entity>
            <a-box class="btn-voltar-texto raycastable" position="-0.22 -0.04 0.02" width="0.32" height="0.20" depth="0.05" material="color: #1F3A5F">
                <a-triangle position="0 0 0.03" rotation="0 0 90" vertex-a="0 0.05 0" vertex-b="-0.04 -0.025 0" vertex-c="0.04 -0.025 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
            </a-box>
            <a-box class="btn-avancar-texto raycastable" position="0.22 -0.04 0.02" width="0.32" height="0.20" depth="0.05" material="color: #1F3A5F">
                <a-triangle position="0 0 0.03" rotation="0 0 -90" vertex-a="0 0.05 0" vertex-b="-0.04 -0.025 0" vertex-c="0.04 -0.025 0" material="color: #58a6ff; shader: flat; side: double"></a-triangle>
            </a-box>
        </a-entity>

        <!-- DIREITA: TROCAR CENA (BOTÕES ROSAS) -->
        <a-entity position="0.9 0.25 0.07">
            <a-entity position="0 0.15 0.005" text="value: TROCAR CENA; color: #FFB6C1; align: center; width: 1.6; font: roboto"></a-entity>
            <a-box class="btn-cena-anterior raycastable" position="-0.22 -0.04 0.02" width="0.32" height="0.20" depth="0.05" material="color: #5F1F3A">
                <a-triangle position="0 0 0.03" rotation="0 0 90" vertex-a="0 0.05 0" vertex-b="-0.04 -0.025 0" vertex-c="0.04 -0.025 0" material="color: #FFB6C1; shader: flat; side: double"></a-triangle>
            </a-box>
            <a-box class="btn-cena-proxima raycastable" position="0.22 -0.04 0.02" width="0.32" height="0.20" depth="0.05" material="color: #5F1F3A">
                <a-triangle position="0 0 0.03" rotation="0 0 -90" vertex-a="0 0.05 0" vertex-b="-0.04 -0.025 0" vertex-c="0.04 -0.025 0" material="color: #FFB6C1; shader: flat; side: double"></a-triangle>
            </a-box>
        </a-entity>


        <!-- LINHA INFERIOR: CONTROLE DE FLUXO (ELEVADO E CENTRALIZADO) -->
        <a-entity position="0 -0.16 0.07">
            <a-entity position="0 0.18 0.005" text="value: FLUXO DE MÚONS POR CICLO; color: #00FF7F; align: center; width: 2.0; font: roboto"></a-entity>
            
            <!-- Botão 3 Múons (Ativo) -->
            <a-entity class="btn-muons-3 raycastable" position="-0.65 -0.05 0.02">
                <a-box class="bg-btn-3 raycastable" width="1.1" height="0.26" depth="0.06" material="color: #00FF7F"></a-box>
                <a-entity position="0 0 0.035" text="value: 3 MÚONS; color: #111; align: center; width: 1.8; font: roboto"></a-entity>
            </a-entity>

            <!-- Botão 6 Múons (Inativo) -->
            <a-entity class="btn-muons-6 raycastable" position="0.65 -0.05 0.02">
                <a-box class="bg-btn-6 raycastable" width="1.1" height="0.26" depth="0.06" material="color: #9370DB"></a-box>
                <a-entity position="0 0 0.035" text="value: 6 MÚONS; color: #FFF; align: center; width: 1.8; font: roboto"></a-entity>
            </a-entity>
        </a-entity>

    </a-entity>

</a-entity>

        <a-sky src="#imSky" rotation="0 -90 0"></a-sky>
        <a-entity light="type: ambient; color: #555"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="-1 10 5"></a-entity>
        <a-plane position="0 0 0" rotation="-90 0 0" width="1000" height="1000" material="color: #002244; opacity: 0.95; transparent: true"></a-plane>
        
        <a-entity id="boat" position="0 -0.1 0" rotation="0 180 0">
            <a-box position="0 0.2 0" width="1.6" height="0.4" depth="4" material="color: #3b2107; roughness: 1; metalness: 0"></a-box>
            <a-box position="-0.85 0.5 0" width="0.1" height="0.6" depth="4.2" material="color: #4b3117; roughness: 1; metalness: 0" rotation="0 0 -5"></a-box>
            <a-box position="0.85 0.5 0" width="0.1" height="0.6" depth="4.2" material="color: #4b3117; roughness: 1; metalness: 0" rotation="0 0 5"></a-box>

            <a-entity position="0 0.5 -2.1" rotation="0 180 0">
                <a-triangle vertex-a="0 0 0" vertex-b="-0.8 0 0" vertex-c="0 0 1" material="color: #3b2107; side: double" rotation="-90 0 0"></a-triangle>
                <a-triangle vertex-a="0 0 0" vertex-b="0.8 0 0" vertex-c="0 0 1" material="color: #3b2107; side: double" rotation="-90 0 0"></a-triangle>
                <a-plane position="-0.4 0.1 0.5" width="1.1" height="0.6" material="color: #4b3117; side: double; roughness: 1" rotation="-5 125 0"></a-plane>
                <a-plane position="0.4 0.1 0.5" width="1.1" height="0.6" material="color: #4b3117; side: double; roughness: 1" rotation="-5 -125 0"></a-plane>
                <a-box position="0 0.1 0" width="0.05" height="0.8" depth="0.1" material="color: #2a1805" rotation="20 0 0"></a-box>
            </a-entity>

            <a-entity position="0 0.5 2.1">
                <a-plane position="0 0.1 0" width="1.8" height="0.7" material="color: #4b3117; side: double; roughness: 1" rotation="-10 0 0"></a-plane>
                <a-triangle vertex-a="0 -0.3 0" vertex-b="-0.8 -0.3 0" vertex-c="0 -0.3 -0.5" material="color: #3b2107; side: double"></a-triangle>
                <a-triangle vertex-a="0 -0.3 0" vertex-b="0.8 -0.3 0" vertex-c="0 -0.3 -0.5" material="color: #3b2107; side: double"></a-triangle>
            </a-entity>

            <a-plane position="0 0.42 0" width="1.5" height="3.9" rotation="-90 0 0" material="color: #5d4037; src: #woodPattern; repeat: 5 10; roughness: 1"></a-plane>
            <a-box position="0 0.55 -1.2" width="1.4" height="0.1" depth="0.4" material="color: #3b2107"></a-box>
            <a-box position="0 0.55 0.5" width="1.4" height="0.1" depth="0.4" material="color: #3b2107"></a-box>
            <a-box position="0 0.55 1.6" width="1.4" height="0.1" depth="0.4" material="color: #3b2107"></a-box>
            <a-torus position="0 0.8 0" radius="2.1" radius-tubular="0.02" arc="360" rotation="90 0 0" scale="0.42 1 1" material="color: #2a1805"></a-torus>
        </a-entity>

        <a-entity id="muon-container"></a-entity>
    </a-scene>
</body>
</html>
